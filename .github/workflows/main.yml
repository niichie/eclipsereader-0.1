name: Build eclipsereader IPA
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    # Xcode 27 / iOS 27 SDK: required so the iPhone Duo runs the app full-screen.
    runs-on: xcode-27
    permissions:
      contents: write   # only used to attach the IPA when a version tag (v1.0.0, …) is pushed
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Pick Xcode 27 or newer
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_27*.app /Applications/Xcode-27*.app /Applications/Xcode_28*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$XCODE" ]; then echo "No Xcode 27 on this runner:"; ls -d /Applications/Xcode*; exit 1; fi
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Core tests
        working-directory: EclipseReader
        run: |
          set -o pipefail
          if ! swift test 2>&1 | tee core-tests.log | tail -40; then
            echo "::error::Core tests failed:"
            grep -E "error: |failed \(" core-tests.log | head -20
            exit 1
          fi

      - name: Generate Xcode project
        working-directory: EclipseReader
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen generate --spec project.json

      - name: Build unsigned app
        working-directory: EclipseReader
        run: |
          set -euo pipefail
          xcodebuild build -project EclipseReader.xcodeproj -scheme EclipseReader \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/DeviceData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" ECLIPSE_COMMIT="${GITHUB_SHA::7}" > build.log 2>&1 \
            || { echo "::error::Build failed. Errors:"; grep -E "error:" build.log | sort -u | head -80; exit 1; }
          grep -E "warning:" build.log | grep -v "appintents" | sort -u | head -40 || true
          echo "BUILD SUCCEEDED"

      - name: Package IPA
        working-directory: EclipseReader
        run: |
          set -euo pipefail
          APP='build/DeviceData/Build/Products/Release-iphoneos/EclipseReader.app'
          SDK=$(/usr/libexec/PlistBuddy -c 'Print DTSDKName' "$APP/Info.plist")
          echo "Built with $SDK"
          MAJOR=$(echo "$SDK" | sed 's/iphoneos//' | cut -d. -f1)
          if [ "$MAJOR" -lt 27 ]; then echo "Built with $SDK: the Duo would letterbox it."; exit 1; fi
          python3 scripts/package_ipa.py "$APP" "$GITHUB_WORKSPACE/EclipseReader-unsigned.ipa"
          shasum -a 256 "$GITHUB_WORKSPACE/EclipseReader-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: EclipseReader-unsigned-IPA
          path: EclipseReader-unsigned.ipa
          if-no-files-found: error

      - name: Publish GitHub release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: EclipseReader-unsigned.ipa
          generate_release_notes: true
          name: eclipsereader ${{ github.ref_name }}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: EclipseReader/build.log
          if-no-files-found: ignore
