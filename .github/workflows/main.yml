name: Build eclipsereader IPA
on:
  workflow_dispatch:
  push:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    # Xcode 27 / iOS 27 SDK: required so the iPhone Duo runs the app full-screen.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Pick Xcode 27 or newer
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_27*.app /Applications/Xcode-27*.app /Applications/Xcode_28*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$XCODE" ]; then echo "No Xcode 27 on this runner:"; ls -d /Applications/Xcode*; exit 1; fi
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Core tests
        working-directory: EclipseReader
        run: swift test 2>&1 | tail -40

      - name: Generate Xcode project
        working-directory: EclipseReader
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen generate --spec project.json

      - name: Build unsigned app
        working-directory: EclipseReader
        run: |
          set -euo pipefail
          xcodebuild build -project EclipseReader.xcodeproj -scheme EclipseReader \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build/DeviceData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' > build.log 2>&1 \
            || { echo "::error::Build failed. Errors:"; grep -E "error:" build.log | sort -u | head -80; exit 1; }
          grep -E "warning:" build.log | grep -v "appintents" | sort -u | head -40 || true
          echo "BUILD SUCCEEDED"

      - name: Package IPA
        working-directory: EclipseReader
        run: |
          set -euo pipefail
          APP='build/DeviceData/Build/Products/Release-iphoneos/EclipseReader.app'
          SDK=$(/usr/libexec/PlistBuddy -c 'Print DTSDKName' "$APP/Info.plist")
          echo "Built with $SDK"
          MAJOR=$(echo "$SDK" | sed 's/iphoneos//' | cut -d. -f1)
          if [ "$MAJOR" -lt 27 ]; then echo "Built with $SDK: the Duo would letterbox it."; exit 1; fi
          python3 scripts/package_ipa.py "$APP" "$GITHUB_WORKSPACE/EclipseReader-unsigned.ipa"
          shasum -a 256 "$GITHUB_WORKSPACE/EclipseReader-unsigned.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: EclipseReader-unsigned-IPA
          path: EclipseReader-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: EclipseReader/build.log
          if-no-files-found: ignore

  screens:
    # Photographs every screen on small/large iPhone, iPad, iPad mini and the Duo, portrait and landscape.
    # Manual only (Actions › Run workflow) so it never slows down normal builds.
    if: github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - name: Pick Xcode 27 or newer
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_27*.app /Applications/Xcode-27*.app /Applications/Xcode_28*.app 2>/dev/null | sort -V | tail -1 || true)
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"

      - name: Generate Xcode project
        working-directory: EclipseReader
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen generate --spec project.json

      - name: Choose simulators
        working-directory: EclipseReader
        run: |
          set -euo pipefail
          xcrun simctl list devices available -j > /tmp/devices.json
          python3 scripts/pick_simulators.py /tmp/devices.json | tee /tmp/sims.txt
          test -s /tmp/sims.txt

      - name: Build for testing
        working-directory: EclipseReader
        run: |
          set -euo pipefail
          UDID=$(head -1 /tmp/sims.txt | cut -d'|' -f2)
          xcodebuild build-for-testing -project EclipseReader.xcodeproj -scheme EclipseReader \
            -destination "id=$UDID" -derivedDataPath build/TestData > test-build.log 2>&1 \
            || { echo "::error::Test build failed"; grep -E "error:" test-build.log | sort -u | head -60; exit 1; }

      - name: Screen tour on every device at once
        working-directory: EclipseReader
        run: |
          set -uo pipefail
          mkdir -p /tmp/shots
          DESTS=""
          while IFS='|' read -r KEY UDID NAME; do
            xcrun simctl boot "$UDID" || true
            xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 --wifiBars 3 || true
            DESTS="$DESTS -destination id=$UDID"
          done < /tmp/sims.txt
          # Simulators run side by side; each screenshot is named after its device.
          xcodebuild test-without-building -project EclipseReader.xcodeproj -scheme EclipseReader \
            $DESTS -derivedDataPath build/TestData \
            -only-testing:EclipseReaderUITests/ScreenTourUITests \
            -maximum-concurrent-test-simulator-destinations 5 \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 420 -maximum-test-execution-time-allowance 600 \
            -resultBundlePath /tmp/results/tour.xcresult > /tmp/shots/test.log 2>&1
          STATUS=$?
          grep -E "Test Case|error|failed|passed" /tmp/shots/test.log | tail -60
          xcrun xcresulttool export attachments --path /tmp/results/tour.xcresult --output-path /tmp/shots/raw || true
          python3 - /tmp/shots <<'PY'
          import json, os, re, sys
          root = sys.argv[1]
          raw = os.path.join(root, "raw")
          manifest = os.path.join(raw, "manifest.json")
          if os.path.exists(manifest):
              for test in json.load(open(manifest)):
                  for a in test.get("attachments", []):
                      name = re.sub(r"[^A-Za-z0-9._ -]+", "", a.get("suggestedHumanReadableName", a["exportedFileName"]))
                      src = os.path.join(raw, a["exportedFileName"])
                      if os.path.exists(src):
                          os.replace(src, os.path.join(root, name))
          PY
          ls /tmp/shots | head -200
          exit $STATUS

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: /tmp/shots
          if-no-files-found: warn
