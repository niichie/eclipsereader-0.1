name: Device checks
# Runs the app on an iPhone simulator and checks real books and chapters open in the real reader screens.
on:
  workflow_dispatch:
    inputs:
      only:
        description: Tests to run, comma-separated (default all app checks)
        default: EclipseReaderAppTests
permissions:
  contents: read
jobs:
  simulator:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Pick Xcode 27 or newer
        run: |
          XCODE=$(ls -d /Applications/Xcode_27*.app /Applications/Xcode-27*.app /Applications/Xcode_28*.app 2>/dev/null | sort -V | tail -1 || true)
          echo "DEVELOPER_DIR=$XCODE/Contents/Developer" >> "$GITHUB_ENV"
      - name: Generate project
        working-directory: EclipseReader
        run: |
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodegen generate --spec project.json
      - name: Run on a simulator
        working-directory: EclipseReader
        run: |
          set -o pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in sorted(d, reverse=True) if "iOS" in k for x in d[k] if x["name"].startswith("iPhone")))')
          echo "Simulator $UDID"
          ONLY=()
          IFS=',' read -ra PICKED <<< "${{ inputs.only || 'EclipseReaderAppTests' }}"
          for t in "${PICKED[@]}"; do ONLY+=("-only-testing:$t"); done
          xcodebuild test -project EclipseReader.xcodeproj -scheme EclipseReader \
            -destination "id=$UDID" "${ONLY[@]}" \
            -resultBundlePath checks.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee checks.log | grep -E "CHECK\||error:|Test Case|XCTAssert|failed|passed|\*\* TEST" || true
          if ! grep -q "\*\* TEST SUCCEEDED \*\*" checks.log; then
            echo "----- why it failed -----"
            grep -nE "error|crash|Crash|signal|exception|Exception|unexpected|Terminat" checks.log | grep -v "^.*warning" | tail -40
            echo "----- end of log -----"
            tail -60 checks.log
            echo "----- crash reports -----"
            for f in $(ls -t ~/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -3); do
              echo "== $f"
              python3 - "$f" <<'PY'
          import json, sys
          text = open(sys.argv[1]).read()
          head, _, body = text.partition("\n")
          try:
              report = json.loads(body)
          except Exception:
              print(text[:3000]); sys.exit()
          print(head[:300])
          ex = report.get("exception", {}); print("exception:", ex, report.get("termination", {}).get("indicator"))
          for key in ("asi", "lastExceptionBacktrace"):
              if key in report: print(key, json.dumps(report[key])[:1500])
          images = report.get("usedImages", [])
          for thread in report.get("threads", []):
              if thread.get("triggered"):
                  print("crashed thread:", thread.get("name", ""), thread.get("queue", ""))
                  for frame in thread.get("frames", [])[:40]:
                      image = images[frame.get("imageIndex", 0)].get("name", "?") if images else "?"
                      print("  ", image, frame.get("symbol", hex(frame.get("imageOffset", 0))), frame.get("sourceFile", ""), frame.get("sourceLine", ""))
          PY
            done
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-checks
          path: |
            EclipseReader/checks.log
            EclipseReader/checks.xcresult
          if-no-files-found: ignore
